<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        
        .btn-info {
            background-color: #17a2b8;
            color: white;
        }
        
        .btn-info:hover {
            background-color: #138496;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 14px;
        }

        th a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100%;
            height: 100%;
        }

        th a:hover {
            text-decoration: underline;
        }

        .quick-filter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        th {
            background-color: #667eea;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .actions-column {
            display: flex;
            gap: 5px;
        }

        .advanced-search-panel {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
        }

        .search-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group-search {
            flex: 1;
            min-width: 150px;
        }

        .form-group-search label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        .pagination-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .page-link {
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            background-color: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 4px;
        }

        .page-link.active {
            background-color: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-link:hover:not(.active) {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Product Management System</h1>

        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}"></span>
        </div>

        <div class="advanced-search-panel">
            <h3 style="margin-bottom: 15px; font-size: 1.1em; color: #495057;">Search & Filter</h3>

            <form th:action="@{/products/advanced-search}" method="get" class="search-row">
                <div class="form-group-search">
                    <label>Name</label>
                    <input type="text" name="name" th:value="${param.name}" class="form-control" placeholder="Product name...">
                </div>

                <div class="form-group-search">
                    <label>Category</label>
                    <select name="category" class="form-control">
                        <option value="">All Categories</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat}"
                                th:text="${cat}"
                                th:selected="${cat == param.category}">
                        </option>
                    </select>
                </div>

                <div class="form-group-search" style="flex: 1.5;">
                    <label>Price Range</label>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <input type="number" name="minPrice" th:value="${param.minPrice}" class="form-control" placeholder="Min" step="0.01">
                        <span>-</span>
                        <input type="number" name="maxPrice" th:value="${param.maxPrice}" class="form-control" placeholder="Max" step="0.01">
                    </div>
                </div>

                <div style="padding-bottom: 2px;">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <a th:href="@{/products}" class="btn btn-secondary" style="margin-left: 5px;">Reset</a>
                </div>
            </form>
        </div>

        <div class="actions">
            <form th:action="@{/products}" method="get" class="quick-filter">
                <input type="hidden" name="sortBy" th:value="${sortBy}" />
                <input type="hidden" name="sortDir" th:value="${sortDir}" />

                <label style="font-weight: bold;">Quick Filter:</label>
                <select name="category" onchange="this.form.submit()" style="padding: 10px; border-radius: 5px; border: 1px solid #ddd;">
                    <option value="">View All Categories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:text="${cat}"
                            th:selected="${cat == currentCategory}">
                    </option>
                </select>
            </form>

            <div>
                <a th:href="@{/export/excel}" class="btn btn-success" style="margin-right: 5px;">📥 Export Excel</a>
                <a th:href="@{/dashboard}" class="btn btn-info" style="margin-right: 5px;">📊 Dashboard</a>
                <a th:href="@{/products/new}" class="btn btn-primary">➕ Add New Product</a>
            </div>
        </div>

        <div th:if="${products != null and !products.isEmpty()}">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">Image</th>

                        <th>
                            <a th:href="@{/products(sortBy='id', sortDir=${sortBy=='id' && sortDir=='asc' ? 'desc' : 'asc'}, category=${currentCategory})}">
                                ID <span th:if="${sortBy=='id'}" th:text="${sortDir=='asc' ? '↑' : '↓'}"></span>
                            </a>
                        </th>
                        
                        <th>
                            <a th:href="@{/products(sortBy='productCode', sortDir=${sortBy=='productCode' && sortDir=='asc' ? 'desc' : 'asc'}, category=${currentCategory})}">
                                Code <span th:if="${sortBy=='productCode'}" th:text="${sortDir=='asc' ? '↑' : '↓'}"></span>
                            </a>
                        </th>

                        <th>
                            <a th:href="@{/products(sortBy='name', sortDir=${sortBy=='name' && sortDir=='asc' ? 'desc' : 'asc'}, category=${currentCategory})}">
                                Name <span th:if="${sortBy=='name'}" th:text="${sortDir=='asc' ? '↑' : '↓'}"></span>
                            </a>
                        </th>

                        <th>
                            <a th:href="@{/products(sortBy='price', sortDir=${sortBy=='price' && sortDir=='asc' ? 'desc' : 'asc'}, category=${currentCategory})}">
                                Price <span th:if="${sortBy=='price'}" th:text="${sortDir=='asc' ? '↑' : '↓'}"></span>
                            </a>
                        </th>

                        <th>Quantity</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td>
                            <img th:if="${product.imagePath != null}" 
                                 th:src="@{${product.getPhotosImagePath()}}" 
                                 style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd;" />
                            <span th:if="${product.imagePath == null}" style="color: #999; font-size: 0.8em;">No Img</span>
                        </td>

                        <td th:text="${product.id}">1</td>
                        <td th:text="${product.productCode}">P001</td>
                        <td th:text="${product.name}">Product Name</td>
                        <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$99.99</td>
                        <td th:text="${product.quantity}">10</td>
                        <td th:text="${product.category}">Electronics</td>
                        <td>
                            <div class="actions-column">
                                <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-success btn-sm">✏️ Edit</a>
                                <a th:href="@{/products/delete/{id}(id=${product.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to delete this product?')">
                                    🗑️ Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="pagination-container" th:if="${totalPages != null && totalPages > 1}">
                <a th:if="${currentPage > 0}"
                   th:href="@{/products/search(keyword=${keyword}, page=${currentPage - 1})}"
                   class="page-link">&laquo; Previous</a>

                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/products/search(keyword=${keyword}, page=${i})}"
                       th:text="${i + 1}"
                       th:class="${currentPage == i} ? 'page-link active' : 'page-link'">
                    </a>
                </span>

                <a th:if="${currentPage < totalPages - 1}"
                   th:href="@{/products/search(keyword=${keyword}, page=${currentPage + 1})}"
                   class="page-link">Next &raquo;</a>
            </div>
        </div>

        <div th:if="${products == null or products.isEmpty()}" class="empty-state">
            <p>No products found matching your criteria.</p>
        </div>
    </div>
</body>
</html>
